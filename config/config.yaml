# ============================================================
# 自习室座位占用识别系统 —— 主配置文件
# 修改后无需改代码，重启服务即可生效
# ============================================================

project:
  name: seat-project
  version: 0.1.0
  description: 自习室座位状态（有人/有物无人/空置）识别与占座判定

# ---------- 模型 ----------
model:
  weights: runs/train/seat_v1/weights/best.pt   # 训练产物；不存在时回退到 models/yolov8n.pt
  conf: 0.35                    # 置信度阈值：低于此值的检测框丢弃
  iou: 0.45                     # NMS 重叠阈值
  imgsz: 1280                   # 推理输入尺寸：640 会漏检远端小目标，实测 1280 才稳定
  device: cpu                   # cpu 或 0（有 NVIDIA 显卡时填 0）

# ---------- 摄像头 ----------
camera:
  source: 0                     # 0=本机摄像头；也可填 rtsp://... 或视频文件路径
  interval_sec: 60              # 抓拍间隔（秒），60 表示每分钟分析一次
  reconnect_retry: 3            # 断线重连次数

# ---------- 座位 ROI ----------
# 每个座位一个矩形区域，由「座位标定工具」生成后粘贴到这里
# 坐标系：图片像素坐标，左上角为原点
# 当前内容对应网络演示素材 data/video_demo/main_view.jpg（1920×1410），共 12 座
# 真实照片到位后执行：python scripts/roi_tool.py --image <底图> --load config/rois.json
# 重新标定，再把 config/rois.json 的 seats 段覆盖到这里
seats:
  - id: A01
    name: A桌1号
    roi: [522, 486, 666, 564]
  - id: A02
    name: A桌2号
    roi: [666, 486, 811, 564]
  - id: A03
    name: A桌3号
    roi: [522, 564, 666, 643]
  - id: A04
    name: A桌4号
    roi: [666, 564, 811, 643]
  - id: B01
    name: B桌1号
    roi: [1122, 744, 1280, 853]
  - id: B02
    name: B桌2号
    roi: [1280, 744, 1438, 853]
  - id: B03
    name: B桌3号
    roi: [1122, 853, 1280, 962]
  - id: B04
    name: B桌4号
    roi: [1280, 853, 1438, 962]
  - id: C01
    name: C桌1号
    roi: [801, 823, 964, 937]
  - id: C02
    name: C桌2号
    roi: [964, 823, 1127, 937]
  - id: C03
    name: C桌3号
    roi: [801, 937, 964, 1052]
  - id: C04
    name: C桌4号
    roi: [964, 937, 1127, 1052]

# ---------- 检测类别 ----------
# 模型输出的类别索引固定为：0=person 1=book 2=bag 3=cup 4=item
# item 表示书/包/杯以外的占座物品（笔记本电脑、雨伞、外套、快递盒等）
classes:
  person_id: 0
  object_ids: [1, 2, 3, 4]     # 命中任一即视为「有物」

# ---------- 占座判定 ----------
occupancy:
  object_leave_minutes: 30      # 「有物无人」持续多少分钟判定为占座
  empty_confirm_frames: 3       # 连续多少帧结果一致才更新状态（防抖，避免人走过误报）
  person_iou_threshold: 0.15    # 人体框与座位 ROI 的重叠率阈值，超过视为「坐在该座位」
  object_iou_threshold: 0.10    # 物品框与座位 ROI 的重叠率阈值
  min_object_area_ratio: 0.02   # 物品框面积占 ROI 的最低比例，过滤远处小噪点

# ---------- 豁免时段（不计占座的时段）----------
exempt_time:
  enabled: true
  windows:
    - name: 午休
      start: "12:00"
      end: "13:30"
      days: [mon, tue, wed, thu, fri]
    - name: 闭馆前整理
      start: "21:50"
      end: "22:10"
      days: [mon, tue, wed, thu, fri, sat, sun]

# ---------- 服务 ----------
server:
  host: 127.0.0.1
  port: 8000
  refresh_sec: 5                # 网页看板自动刷新间隔

# ---------- 存储 ----------
storage:
  db_path: data/seat.db         # SQLite 数据库文件
  export_dir: data/exports      # 导出记录目录
  keep_days: 30                 # 历史记录保留天数，超期自动清理

# ---------- 日志 ----------
logging:
  level: INFO                   # DEBUG / INFO / WARNING / ERROR
  dir: logs
  file: app.log
