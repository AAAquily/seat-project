    name: 左桌1号
    roi: [330, 480, 480, 830]
  - id: S04
    name: 前桌1号
    roi: [350, 780, 720, 1279]
  - id: S05
    name: 后墙1号
    roi: [905, 560, 995, 860]
  - id: S06
    name: 后墙左邻
    roi: [845, 560, 920, 850]
  - id: S07
    name: 右墙1号
    roi: [1080, 520, 1260, 810]
  - id: S08
    name: 右墙2号
    roi: [1175, 590, 1470, 1250]
  - id: S09
    name: 右墙3号
    roi: [1380, 550, 1706, 1279]   # 2026-11-06 左边界 1420→1380：黑发女人框 50.0% 压线被溢出剔除，加宽后 57% 强命中
  - id: S10
    name: 外套椅
    roi: [1000, 850, 1180, 1265]
  - id: S11
    name: 红脚凳
    roi: [720, 600, 890, 790]
