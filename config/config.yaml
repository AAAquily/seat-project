# ============================================================
# 自习室座位占用识别系统 —— 主配置文件
# 修改后无需改代码，重启服务即可生效
# ============================================================

project:
  name: seat-project
  version: 0.1.0
  description: 自习室座位状态（有人/有物无人/空置）识别与占座判定

# ---------- 模型 ----------
model:
  weights: runs/train/seat_v5/weights/best.pt   # v5：真实照片 + 帆布包 + 9 帧单座视频帧（mAP50 0.402，person 0.672）
  conf: 0.25                    # 置信度阈值：低于此值的检测框丢弃（0.35 会漏掉白纸等低对比物品）
  video_conf: 0.20              # 视频通道单独阈值（坐姿远机位人体置信度约 0.24，需放宽；空帧实测无 person 误检）
  iou: 0.45                     # NMS 重叠阈值
  imgsz: 1280                   # 推理输入尺寸：640 会漏检远端小目标，实测 1280 才稳定
  device: cpu                   # cpu 或 0（有 NVIDIA 显卡时填 0）

# ---------- 摄像头 ----------
camera:
  source: 0                     # 0=本机摄像头；也可填 rtsp://... 或视频文件路径
  interval_sec: 60              # 抓拍间隔（秒），60 表示每分钟分析一次
  reconnect_retry: 3            # 断线重连次数

# ---------- 座位 ROI ----------
# 每个座位一个矩形区域，由「座位标定工具」生成后粘贴到这里
# 坐标系：图片像素坐标，左上角为原点
# 当前内容对应网络演示素材 data/video_demo/main_view.jpg（1920×1410），共 12 座
# 真实照片到位后执行：python scripts/roi_tool.py --image <底图> --load config/rois.json
# 重新标定，再把 config/rois.json 的 seats 段覆盖到这里
# 由 scripts/make_web_rois.py 自动生成（椅子 + 椅前桌面模型），勿手工编辑
# 由 scripts/make_web_rois.py 自动生成（椅子 + 椅前桌面模型），勿手工编辑
# 由 scripts/make_web_rois.py 自动生成（椅子 + 椅前桌面模型），勿手工编辑
seats:
  - id: S01
    name: 左桌1号
    roi: [30, 620, 470, 1250]
  - id: S02
    name: 左桌2号
    roi: [130, 480, 300, 900]
  - id: S03
    name: 左桌3号
    roi: [330, 480, 480, 830]
  - id: S04
    name: 后桌1号
    roi: [600, 420, 730, 780]
  - id: S05
    name: 后桌2号
    roi: [750, 440, 845, 780]
  - id: S06
    name: 后墙1号
    roi: [845, 560, 920, 850]
  - id: S07
    name: 后墙2号
    roi: [905, 560, 995, 860]
  - id: S08
    name: 右墙1号
    roi: [1080, 520, 1260, 810]
  - id: S09
    name: 右墙2号
    roi: [1175, 590, 1470, 1250]
  - id: S10
    name: 右墙3号
    roi: [1420, 550, 1706, 1279]
  - id: S11
    name: 前桌1号
    roi: [350, 780, 720, 1279]
  - id: S12
    name: 右下1号
    roi: [700, 890, 1000, 1279]
  - id: S13
    name: 右下2号
    roi: [1000, 940, 1260, 1279]

# ---------- 视频通道座位（可选）----------
# 上传视频识别时用这一组座位；留空则回退到上面的 seats。
# 适用竖屏单座测试视频（720×1280，红椅 + 后方长桌）：
#   roi        椅子 + 人常在范围（判人）
#   object_roi 桌面物品区，刻意避开左侧长期放置的纸巾盒和路由器（判物）
video_seats:
  - id: V01
    name: 单座测试
    roi: [0, 300, 480, 1010]
    object_roi: [300, 330, 540, 495]

classes:
  person_id: 0
  object_ids: [1, 2, 3, 4]     # 命中任一即视为「有物」

# ---------- 占座判定 ----------
occupancy:
  object_leave_minutes: 30      # 「有物无人」持续多少分钟判定为占座
  empty_confirm_frames: 3       # 连续多少帧结果一致才更新状态（防抖，避免人走过误报）
  person_iou_threshold: 0.50    # 人体框与座位 ROI 的重叠率阈值；取高值防止邻桌的人被算进来（ROI 含椅子区后邻座会接触）
  object_iou_threshold: 0.10    # 物品框与座位 ROI 的重叠率阈值
  min_object_area_ratio: 0.02   # 物品框面积占 ROI 的最低比例，过滤远处小噪点

# ---------- 豁免时段（不计占座的时段）----------
exempt_time:
  enabled: true
  windows:
    - name: 午休
      start: "12:00"
      end: "13:30"
      days: [mon, tue, wed, thu, fri]
    - name: 闭馆前整理
      start: "21:50"
      end: "22:10"
      days: [mon, tue, wed, thu, fri, sat, sun]

# ---------- 演示与看板 ----------
# 没有摄像头时，看板的「立即检测」按钮与演示接口使用下面这张底图
demo:
  image: data/raw_real/real_02.jpg
  annotated_image: runs/judge/latest.jpg

# ---------- 服务 ----------
server:
  host: 127.0.0.1
  port: 8000
  refresh_sec: 5                # 网页看板自动刷新间隔

# ---------- 存储 ----------
storage:
  db_path: data/seat.db         # SQLite 数据库文件
  export_dir: data/exports      # 导出记录目录
  keep_days: 30                 # 历史记录保留天数，超期自动清理

# ---------- 日志 ----------
logging:
  level: INFO                   # DEBUG / INFO / WARNING / ERROR
  dir: logs
  file: app.log
