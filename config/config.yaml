# ---------- 视频通道座位（可选）----------
# 上传视频识别时用这一组座位；留空则回退到上面的 seats。
# 适用竖屏单座测试视频（720×1280，红椅 + 后方长桌）：
#   roi        椅子 + 人常在范围（判人）
#   object_roi 桌面物品区，刻意避开左侧长期放置的纸巾盒和路由器（判物）
video_seats:
  - id: V01
    name: 单座测试
    roi: [0, 300, 480, 1010]
    object_roi: [300, 330, 540, 495]

classes:
  person_id: 0
  object_ids: [1, 2, 3, 4]     # 命中任一即视为「有物」
  stool_id: 5                  # 座位实体（红脚凳）：配合座位 exists_check: stool 判断座位是否在画面中

# ---------- 占座判定 ----------
occupancy:
  object_leave_minutes: 30      # 「有物无人」持续多少分钟判定为占座
  empty_confirm_frames: 3       # 连续多少帧结果一致才更新状态（防抖，避免人走过误报）
  person_iou_threshold: 0.50    # 人体框与座位 ROI 的重叠率阈值；取高值防止邻桌的人被算进来（ROI 含椅子区后邻座会接触）
  person_center_fallback: true  # 人数优先：主体重叠不足但框中心落在座位 ROI 内时也计为有人（防视角偏移漏检）
  person_center_fallback_margin: 60  # 中心点兜底时 ROI 四边的外扩容差（像素）
  person_cross_dedup_ratio: 0.70  # 跨座位「同人碎片」判定阈值（2026-11-07 由硬编码 0.50 上调为可配）：
                                 # 相邻座位前后排的人本来就重叠 0.5~0.65，0.50 会把真人当碎片丢掉，
                                 # 实测 real_05 前景白衣女因此被判「有物无人」；0.70 只合并几乎完全重合的双框
  person_spill_own_ratio: 0.75   # 边界溢出剔除的本座位重叠率上限（v6 标定通道实测 0.75 最准：
                                 # 右墙3号黑发女横跨 S08/S09，主体框 own 0.67 需被剔除、由 S09 的框计数）
  stool_exist_ratio: 0.30       # exists_check=stool 的座位：stool 框与 ROI 重叠率达到该值才算座位存在
  object_iou_threshold: 0.10    # 物品框与座位 ROI 的重叠率阈值
  min_object_area_ratio: 0.02   # 物品框面积占 ROI 的最低比例，过滤远处小噪点
  min_person_box_height: 45     # 人框最小高度（像素）：低于此值视为墙上海报区误检碎片
                                # 直接丢弃（实测 real_02 左桌上方 35×30 假人框 conf 0.169；
                                # 本机位真实人物最矮 ≥90px，阈值 45 安全）
  calib_person_conf: 0.20       # 标定通道人框置信度下限（scene_conf 0.15 只为物品放宽）。
                                # 0.20-0.30 区间仍有真人：real_07 左2黑衣男上半身碎片框
                                # conf 0.22 是该座唯一证据，砍到 0.30 会把 C02 判成空座；
                                # 更低的框（挂衣空椅 0.23）交给座位级 min_person_conf 处理
  fallback_min_conf: 0.30       # 中心点兜底命中的最低置信度：白外套/挂包椅子会被
                                # v6 以 0.2 左右的低置信度误检成「人」（real_08 挂白
                                # 外套椅 conf 0.23），低于该值不参与兜底计数

# ---------- 豁免时段（不计占座的时段）----------
exempt_time:
  enabled: true
  windows:
    - name: 午休
      start: "12:00"
      end: "13:30"
      days: [mon, tue, wed, thu, fri]
    - name: 闭馆前整理
      start: "21:50"
      end: "22:10"
      days: [mon, tue, wed, thu, fri, sat, sun]

# ---------- 演示与看板 ----------
# 没有摄像头时，看板的「立即检测」按钮与演示接口使用下面这张底图
demo:
  image: data/raw_real/real_02.jpg
  annotated_image: runs/judge/latest.jpg

# ---------- 服务 ----------
server:
  host: 127.0.0.1
  port: 8000
  refresh_sec: 5                # 网页看板自动刷新间隔

# ---------- 存储 ----------
storage:
  db_path: data/seat.db         # SQLite 数据库文件
  export_dir: data/exports      # 导出记录目录
  keep_days: 30                 # 历史记录保留天数，超期自动清理

# ---------- 日志 ----------
logging:
  level: INFO                   # DEBUG / INFO / WARNING / ERROR
  dir: logs
  file: app.log
