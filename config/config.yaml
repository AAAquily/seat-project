# ============================================================
# 自习室座位占用识别系统 —— 主配置文件
# 修改后无需改代码，重启服务即可生效
# ============================================================

project:
  name: seat-project
  version: 0.1.0
  description: 自习室座位状态（有人/有物无人/空置）识别与占座判定

# ---------- 模型 ----------
model:
  weights: runs/train/seat_v8/weights/best.pt   # v8：标签框级审计修正 + 瓦片增广 + 海报负样本重训，
                                # 验证集 mAP50 0.650、28 图回归 96.4%（27/28）；动态/视频/看板通道使用
                                # （v7b 0.586/89.3%；v8b 拼贴微调反而过拟合已弃用）
                                # 配套 dynamic_seats.COCO_PERSON_FLOOR=0.60 + 墙面海报过滤规则
  fixed_weights: runs/train/seat_v6/weights/best.pt   # 标定场景（上传图片命中参考图）专用：
                                # 白天外套椅帆布包 conf≈0.19 只有 v6 检得出，v7b 会把该座误判「空置」
  conf: 0.25                    # 置信度阈值：低于此值的检测框丢弃（0.35 会漏掉白纸等低对比物品）
  scene_conf: 0.15              # 标定场景（上传图片走固定座位表）专用阈值：
                                # 白天外套椅的帆布包置信度约 0.19，0.25 会漏检导致「有物无人」判成「空座」
  video_conf: 0.20              # 视频通道单独阈值（坐姿远机位人体置信度约 0.24，需放宽；空帧实测无 person 误检）
  iou: 0.45                     # NMS 重叠阈值
  imgsz: 1280                   # 推理输入尺寸：640 会漏检远端小目标，实测 1280 才稳定
  device: cpu                   # cpu 或 0（有 NVIDIA 显卡时填 0）

# ---------- 摄像头 ----------
camera:
  source: 0                     # 0=本机摄像头；也可填 rtsp://... 或视频文件路径
  interval_sec: 60              # 抓拍间隔（秒），60 表示每分钟分析一次
  reconnect_retry: 3            # 断线重连次数

# ---------- 座位 ROI ----------
# 每个座位一个矩形区域，由「座位标定工具」生成后粘贴到这里
# 坐标系：图片像素坐标，左上角为原点
# 当前内容对应网络演示素材 data/video_demo/main_view.jpg（1920×1410），共 12 座
# 真实照片到位后执行：python scripts/roi_tool.py --image <底图> --load config/rois.json
# 重新标定，再把 config/rois.json 的 seats 段覆盖到这里
# 由 scripts/roi_tool.py 标定，2026-11-06 按用户确认的 11 座基准重标：
#   real_03（白天）基准 = 11 座：6 有人 + 3 空座（红椅A/红椅B/红胶凳）+ 2 有物无人（外套椅/窗边左邻）
#   real_02（夜晚）同机位；后桌1号/后桌2号/右下1号/桌后小红椅的椅子已被挪走，不计为座位
