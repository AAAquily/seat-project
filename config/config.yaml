# ---------- 标定场景参考图 ----------
# 上传图片与这些参考图特征匹配成功时，走该参考图对应的固定座位表（标定场景，精度最高）；
# 匹配不上则回退到动态座位识别（任意场景可用）。
# 条目支持两种写法：
#   - 纯路径字符串（旧格式）：使用下方全局 seats 表
#   - dict：image=参考图路径；seats=该场景专属座位表（内联，优先于全局表）
# real_02（夜晚）专属表 R01–R13 按 2026-11-07 用户手动标注重标：
